<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>ふわっちのオエッボタン</title><link rel="stylesheet" href="style.css?v=6"></head><body>
<header><div class="header-top"><nav class="social-links" aria-label="공식 채널"><a href="http://www.youtube.com/@FuwaMinato" target="_blank" rel="noopener" aria-label="Fuwa Minato YouTube"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4L15.8 12Z"/></svg></a><a href="https://x.com/Fuwa_Minato" target="_blank" rel="noopener" aria-label="Fuwa Minato X"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.9-9L.8 2h6.5l4.5 6.8L18.9 2ZM17.8 20h1.7L6.3 3.9H4.5Z"/></svg></a></nav><label class="language-control"><span aria-hidden="true">◎</span><select id="language-select" aria-label="Language / 言語 / 언어"><option value="ko">한국어</option><option value="ja">日本語</option></select></label></div><div class="title-row"><h1 data-copy-key="site.title">ふわっちのオエッボタン</h1></div><p data-copy-key="site.subtitle">잊을 수 없는 그 순간, 한 번 더.</p><p id="total-count" aria-live="polite">0편 · 0클립</p></header>
<main><section class="card controls" aria-label="재생 조작"><div class="bar"><button id="random" class="primary">✦ 랜덤 재생</button><label><input id="loop" type="checkbox"> 반복</label><label><input id="auto" type="checkbox"> 연속 재생</label><label class="volume-control">음량 <input id="volume" type="range" min="0" max="100" value="60" aria-label="음량"><output id="volume-value">60%</output></label></div><p id="status" role="status" aria-live="polite">좋아하는 순간을 골라보세요.</p></section>
<section id="playing" class="card" aria-label="현재 재생" hidden><div id="video-panel" data-open="false" aria-hidden="true"><div class="video-panel-heading"><span id="video-caption"></span><button id="video-close" aria-label="영상 접기">×</button></div><div class="video-wrap"><div id="player"></div></div></div><div class="now-bar"><div class="sound-mark" aria-hidden="true">▥</div><div class="now-info"><span id="mode-label" class="tag">듣기</span> <span id="playing-number"></span><h2 id="playing-title"></h2><p id="playing-info"></p></div><div class="now-actions"><button id="pause">일시정지</button><button id="favorite" aria-label="즐겨찾기에 추가" aria-pressed="false">☆</button><button id="video-toggle" aria-controls="video-panel" aria-expanded="false">⌃ 영상 보기</button><a id="original" target="_blank" rel="noopener">원본</a><button id="stop">정지</button></div></div><div class="progress-row"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" aria-label="클립 재생 위치"><span id="duration">0:00</span></div></section>
<section class="card side-panel"><div class="panel-head"><div role="tablist" aria-label="즐겨찾기와 기록"><button id="history-tab" role="tab" aria-selected="true" aria-controls="saved-panel">재생 기록 <span id="history-count">0</span></button><button id="favorites-tab" role="tab" aria-selected="false" aria-controls="saved-panel">즐겨찾기 <span id="favorites-count">0</span></button></div><button id="panel-toggle" aria-expanded="false" aria-controls="saved-panel">펼치기 ⌄</button></div><div id="saved-panel" hidden role="tabpanel" aria-labelledby="history-tab"><div id="saved-list"></div><div class="panel-foot"><span>이 브라우저에 저장됩니다.</span><button id="clear-history">기록 지우기</button></div></div></section>

<section class="collection" aria-label="클립 목록"><div class="filters"><label>연도 <select id="year" aria-label="연도"><option value="">전체</option></select></label><label>장르 <select id="category" aria-label="장르"><option value="">전체 장르</option></select></label><button id="reset-filters">전체 취소</button><button id="expand-all">모두 펼치기</button></div><p id="count" class="filtered-count" aria-live="polite"></p><p id="sample-note" class="notice" hidden>현재 테스트용 유튜브 영상만 등록되어 있습니다.</p><div id="list"></div></section>
<footer><p data-copy-key="site.footer">후와 미나토 비공식 팬사이트 · 공식 및 관계자와 관련이 없습니다.</p><p>유튜브 공식 임베드 플레이어로 원본 영상의 지정 구간을 재생합니다. 조회수 반영 여부는 YouTube의 집계 기준에 따릅니다.</p></footer></main><script src="i18n.js?v=6"></script><script src="app.js?v=6"></script></body></html>
